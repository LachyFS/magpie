name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, such as v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version tag
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/package.py --validate-tag "$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  packages:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  publish:
    needs: [prepare, packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: magpie-*
          path: dist
          merge-multiple: true
      - name: Verify all downloads
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 5
          sha256sum --check SHA256SUMS.txt
          rm -- *.sha256
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/magpie-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/magpie-release.json"))["isDraft"], "This release is already published; use a new version"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Magpie $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
