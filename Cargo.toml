[package]
name = "magpie"
version = "0.1.1"
edition = "2024"
description = "Collect what catches your eye. A native infinite mood board, built with Rust and GPUI."
license = "Apache-2.0"
repository = "https://github.com/LachyFS/magpie"
readme = "README.md"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:unicode-segmentation", "dep:env_logger", "dep:objc", "dep:block", "dep:cocoa", "dep:raw-window-handle"]

[dependencies]
anyhow = "1"
directories = "6"
gpui = { version = "=0.2.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = { version = "1", optional = true }
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
cocoa = { version = "0.26", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[[bin]]
name = "magpie"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
